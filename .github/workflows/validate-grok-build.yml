name: Validate Grok Build adapter

on:
  push:
    branches:
      - feat/grok-build-provider
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workflows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Sync dependencies
        run: uv sync --python 3.12
      - name: Compile changed Python
        run: uv run python -m compileall -q cli.py workflow_use/llm workflow_use/healing/service.py tests/test_grok_build_llm.py
      - name: Ruff changed Python
        run: uv run ruff check cli.py workflow_use/llm/grok_build.py workflow_use/llm/factory.py workflow_use/llm/__init__.py tests/test_grok_build_llm.py
      - name: Adapter unit tests
        run: uv run python -m unittest discover -s tests -p "test_grok_build_llm.py"
      - name: CLI smoke test
        run: uv run python cli.py --help
      - name: Generate command smoke test
        run: uv run python cli.py generate-workflow --help
